name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-x64:
    name: Verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release policy
        run: npm run release:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test -- --run

      - name: Type-check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Audit Rust dependencies and licenses
        shell: pwsh
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path src-tauri/Cargo.toml check advisories licenses sources

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build Windows smoke artifact
        run: npm run tauri build -- --no-bundle

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $source = "src-tauri/target/release/bambu-filament-migrator.exe"
          $target = "artifacts/Bambu-Filament-Migrator-windows-x64.exe"
          Copy-Item $source $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Bambu-Filament-Migrator-windows-x64.exe" | Set-Content -Encoding ascii "artifacts/Bambu-Filament-Migrator-windows-x64.exe.sha256"

      - name: Upload Windows smoke artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bambu-filament-migrator-windows-x64
          path: artifacts/*
          if-no-files-found: error
