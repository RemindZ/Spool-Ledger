name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.contract.outputs.version }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Require a protected release tag ref
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_REF_PROTECTED" = "true"

      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Prove tag belongs to main
        id: source
        shell: bash
        run: |
          git fetch origin main --no-tags
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" origin/main
          echo "commit_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate release policy and tag contract
        id: contract
        shell: bash
        run: |
          npm run release:check
          contract=$(npm run --silent release:contract -- --tag "$RELEASE_TAG")
          version=$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$contract")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify tagged Windows source
        shell: pwsh
        run: |
          npm run release:check
          npm run format:check
          npm run lint
          npm test -- --run
          npm run check
          npm run build
          npm run visual:check
          npm audit --audit-level=high
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Audit Rust dependencies and licenses
        shell: pwsh
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path src-tauri/Cargo.toml check advisories licenses sources

      - name: Build and normalize Windows artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null

          npm run tauri build -- --bundles nsis
          $nsis = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Copy-Item $nsis[0] "release-assets/Spool-Ledger-v$env:VERSION-windows-x64-setup.exe"

          npm run tauri build -- --bundles msi
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi")
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer" }
          Copy-Item $msi[0] "release-assets/Spool-Ledger-v$env:VERSION-windows-x64.msi"

          npm run tauri build -- --no-bundle
          Copy-Item "src-tauri/target/release/bambu-filament-migrator.exe" "release-assets/Spool-Ledger-v$env:VERSION-windows-x64-portable.exe"

          $files = @(Get-ChildItem release-assets -File | Sort-Object Name)
          if ($files.Count -ne 3 -or ($files | Where-Object Length -eq 0)) {
            throw "Windows release artifact contract failed"
          }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $lines | Set-Content -Encoding ascii release-assets/windows-SHA256SUMS.txt

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, spool-ledger-release]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Remove any previous Mac checkout
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/source"

      - name: Check out validated source into disposable workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          clean: true
          path: source

      - name: Check Mac runner prerequisites
        working-directory: source
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          xcode-select -p
          df -h .

      - name: Install universal Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: source/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: source
        run: npm ci

      - name: Verify tagged macOS source
        working-directory: source
        shell: bash
        run: |
          npm run release:check
          npm run format:check
          npm run lint
          npm test -- --run
          npm run check
          npm run build
          npm run visual:check
          npm audit --audit-level=high
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Audit Rust dependencies and licenses
        working-directory: source
        shell: bash
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path src-tauri/Cargo.toml check advisories licenses sources

      - name: Build and inspect universal macOS artifact
        working-directory: source
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          npm run tauri build -- --bundles app,dmg --target universal-apple-darwin
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Spool Ledger.app"
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/bambu-filament-migrator"
          architectures=$(lipo -archs "$executable")
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "io.github.remindz.bambu-filament-migrator"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "12.0"
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")
          test -f "$app/Contents/Resources/$icon" || test -f "$app/Contents/Resources/$icon.icns"

          mkdir -p release-assets
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          cp "${dmg[0]}" "release-assets/Spool-Ledger-v$VERSION-macos-universal.dmg"
          test -s "release-assets/Spool-Ledger-v$VERSION-macos-universal.dmg"
          (cd release-assets && shasum -a 256 Spool-Ledger-*.dmg | awk '{print $1 " *" $2}' > macos-SHA256SUMS.txt)

      - name: Upload macOS release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ env.RELEASE_TAG }}
          path: source/release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove disposable Mac checkout
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/source"

  assemble-release:
    needs: [preflight, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out release contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-${{ env.RELEASE_TAG }}
          path: downloaded/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-${{ env.RELEASE_TAG }}
          path: downloaded/macos

      - name: Verify exact artifact contract and checksums
        shell: bash
        run: |
          (cd downloaded/windows && sha256sum -c windows-SHA256SUMS.txt)
          (cd downloaded/macos && sha256sum -c macos-SHA256SUMS.txt)
          mkdir final
          cp downloaded/windows/Spool-Ledger-* final/
          cp downloaded/macos/Spool-Ledger-* final/
          contract=$(npm run --silent release:contract -- --tag "$RELEASE_TAG")
          node - "$contract" <<'NODE'
          const {readdirSync} = require("node:fs");
          const {isDeepStrictEqual} = require("node:util");
          const expected = JSON.parse(process.argv[2]).artifacts.sort();
          const actual = readdirSync("final").sort();
          if (!isDeepStrictEqual(actual, expected)) {
            console.error({expected, actual});
            process.exit(1);
          }
          NODE
          (cd final && sha256sum Spool-Ledger-* | sort -k2 > SHA256SUMS.txt)
          (cd final && sha256sum -c SHA256SUMS.txt)

      - name: Upload verified final bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-final-${{ env.RELEASE_TAG }}
          path: final/*
          if-no-files-found: error
          retention-days: 7

  attest-release:
    needs: assemble-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified final bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-final-${{ env.RELEASE_TAG }}
          path: final

      - name: Attest unsigned release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: final/*

  assemble-draft-release:
    needs: [preflight, assemble-release, attest-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download verified final bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-final-${{ env.RELEASE_TAG }}
          path: final

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"

          generated=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body)
          {
            cat docs/release/unsigned-release-notice.md
            printf '\n\n## Changes\n\n%s\n' "$generated"
          } > generated-release-notes.md

          require_draft() {
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          }

          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-draft 2>/dev/null; then
            test "$(cat existing-draft)" = "true" || { echo "Refusing to modify a published release"; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "Spool Ledger v$VERSION (unsigned initial release)" \
              --notes-file generated-release-notes.md
          fi

          mapfile -t expected_assets < <(find final -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t remote_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in "${remote_assets[@]}"; do
            if ! printf '%s\n' "${expected_assets[@]}" | grep -Fqx -- "$asset"; then
              require_draft
              gh release delete-asset "$RELEASE_TAG" "$asset" -y
            fi
          done

          for file in final/*; do
            require_draft
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done

          mapfile -t remote_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${remote_assets[@]}")
          require_draft
          gh release edit "$RELEASE_TAG" --draft \
            --title "Spool Ledger v$VERSION (unsigned initial release)" \
            --notes-file generated-release-notes.md
          require_draft
