name: macOS Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-acceptance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-macos-universal:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: [self-hosted, macOS, ARM64, spool-ledger-release]
    timeout-minutes: 120
    steps:
      - name: Require protected main
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"

      - name: Remove any previous acceptance checkout
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/source"

      - name: Check out immutable accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          clean: true
          path: source

      - name: Check Mac runner prerequisites
        working-directory: source
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcode-select -p
          df -h .

      - name: Install universal Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: source/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: source
        run: npm ci

      - name: Verify protected source
        working-directory: source
        shell: bash
        run: |
          npm run release:check
          npm run format:check
          npm run lint
          npm test -- --run
          npm run check
          npm run build
          npm run visual:check
          npm audit --audit-level=high
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Characterize installed profiles without live writes
        working-directory: source
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test commands installed_elegoo_pet_cf_resolves_bambu_pet_cf_target_without_live_writes -- --ignored --exact --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --test copied_roots copied_macos_roots_execute_backup_restore_and_receipt_without_live_writes -- --ignored --exact --nocapture

      - name: Audit Rust dependencies and licenses
        working-directory: source
        shell: bash
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path src-tauri/Cargo.toml check advisories licenses sources

      - name: Build and inspect universal application
        working-directory: source
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm run tauri build -- --bundles app,dmg --target universal-apple-darwin

          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Spool Ledger.app"
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/bambu-filament-migrator"
          architectures=$(lipo -archs "$executable")
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "io.github.remindz.bambu-filament-migrator"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "12.0"
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")
          test -f "$app/Contents/Resources/$icon" || test -f "$app/Contents/Resources/$icon.icns"

          mkdir -p acceptance
          shopt -s nullglob
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          cp "${dmg[0]}" "acceptance/Spool-Ledger-v$VERSION-macos-universal.dmg"
          test -s "acceptance/Spool-Ledger-v$VERSION-macos-universal.dmg"
          (cd acceptance && shasum -a 256 Spool-Ledger-*.dmg | awk '{print $1 " *" $2}' > macos-SHA256SUMS.txt)
          (cd acceptance && shasum -a 256 -c macos-SHA256SUMS.txt)

      - name: Upload universal acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal-acceptance-${{ github.sha }}
          path: source/acceptance/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove disposable acceptance checkout
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/source"
