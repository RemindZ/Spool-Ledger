[package]
name = "bambu-filament-migrator"
version = "0.1.0"
description = "Migrate OrcaSlicer and Bambu Studio filament presets into Bambu custom filaments"
authors = ["Remindz"]
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"

[lib]
name = "bambu_filament_migrator"
path = "src/lib.rs"

[[bin]]
name = "bambu-filament-migrator"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
