[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is pinned by Tauri plist metadata; Spool Ledger accepts no untrusted XML" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is pinned by Tauri plist metadata; Spool Ledger accepts no untrusted XML" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
